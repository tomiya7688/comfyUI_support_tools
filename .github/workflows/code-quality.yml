name: Code quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            tools/quality/requirements.txt

      - name: Install quality dependencies
        run: |
          # Upgrade the old bootstrap pip using the SHA-256 published by Python.org.
          python -m pip install 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70'
          python -m pip install 'certifi>=2026.10.19'
          python -m pip install -r requirements-dev.txt

      - name: Verify Python CA bundles
        run: python tools/security/check_python_ca.py

      - name: Run quality and resource-lifetime unit tests
        run: |
          python -m unittest \
            tests.tools.quality.test_quality_gate \
            tests.tools.completion.test_completion_gate \
            tests.test_resource_lifetime

      - name: Run incremental quality gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_REF="HEAD^"
          fi
          python tools/quality/quality_gate.py --base-ref "$BASE_REF"
