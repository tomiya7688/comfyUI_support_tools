name: PyInstaller onedir

on:
  # This is a required check: never leave a docs-only or src-only PR pending.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build security-patched Python 3.11.18 from source
        shell: pwsh
        run: |
          $version = "3.11.18"
          $archive = Join-Path $env:RUNNER_TEMP "Python-$version.tgz"
          $sourceRoot = Join-Path $env:RUNNER_TEMP "Python-$version"
          $archiveUrl = "https://www.python.org/ftp/python/$version/Python-$version.tgz"
          $expectedSha256 = "5f62711b12470fd435f83f1451c1b1ef4a179aebc715c716874b0967567d814e"

          Invoke-WebRequest -Uri $archiveUrl -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "CPython source archive SHA-256 mismatch: $actualSha256"
          }

          tar -xzf $archive -C $env:RUNNER_TEMP
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsInstall) {
            throw "Visual Studio C++ build tools were not found."
          }
          $vcvars = Join-Path $vsInstall "VC\Auxiliary\Build\vcvars64.bat"
          $buildCommand = "`"$vcvars`" && cd /d `"$sourceRoot`" && PCbuild\build.bat -p x64 -c Release -e -M -q"
          & cmd.exe /d /c $buildCommand
          if ($LASTEXITCODE -ne 0) {
            throw "CPython $version source build failed with exit code $LASTEXITCODE."
          }

          $tclLibrary = Join-Path $sourceRoot "externals\tcltk-8.6.12.1\amd64\lib"
          $tclDestination = Join-Path $sourceRoot "PCbuild\lib"
          New-Item -ItemType Directory -Force -Path $tclDestination | Out-Null
          Copy-Item -Path (Join-Path $tclLibrary '*') -Destination $tclDestination -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $sourceRoot "LICENSE") -Destination (Join-Path $sourceRoot "LICENSE.txt")
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $sourceRoot "PCbuild\amd64")

      - name: Verify Python release and compromised-key rejection
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:3] == (3, 11, 18), sys.version"
          python -m ensurepip --upgrade
          python -m unittest test.test_ssl.SSLObjectTests.test_distrusted_spki

      - name: Install dependencies
        shell: pwsh
        run: |
          # The SHA-256 is published in the Python.org incident announcement.
          python -m pip install 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70'
          python -m pip install 'certifi>=2026.10.19'
          python -m pip install -r requirements-kadoka-tools.txt
          python -m pip install -r tools/build/requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify Python CA bundles
        run: python tools/security/check_python_ca.py

      - name: Run completion gate
        run: python tools/completion/completion_gate.py

      - name: Build and smoke test one-dir distribution
        run: python tools/build/build_one_dir.py --smoke-test

      - name: Verify frozen CA bundle
        run: python tools/security/check_python_ca.py --distribution-root dist/KadokaTools

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/KadokaTools/KadokaTools.exe")) {
            throw "dist/KadokaTools/KadokaTools.exe was not created"
          }

      - name: Upload one-dir artifact
        uses: actions/upload-artifact@v4
        with:
          name: KadokaTools-windows-onedir
          path: dist/KadokaTools/
          if-no-files-found: error
