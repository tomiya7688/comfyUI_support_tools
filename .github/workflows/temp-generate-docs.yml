name: temporary-generate-docs

on:
  push:
    branches:
      - security/resource-lifetime-ci-20261025

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Generate code-derived documentation
        run: python tools/docs/generate_docs.py
      - name: Commit generated documentation
        shell: bash
        run: |
          if git diff --quiet -- doc/generated/class_diagram.mmd; then
            echo "generated docs already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/generated/class_diagram.mmd
          git commit -m "Update generated class diagram"
          git push origin HEAD:security/resource-lifetime-ci-20261025
