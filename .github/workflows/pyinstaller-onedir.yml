name: PyInstaller onedir

on:
  pull_request:
    paths:
      - "tabbed_tools_gui.py"
      - "scripts/**"
      - "requirements-kadoka-tools.txt"
      - "tools/build/**"
      - ".github/workflows/pyinstaller-onedir.yml"
  push:
    branches:
      - main
    paths:
      - "tabbed_tools_gui.py"
      - "scripts/**"
      - "requirements-kadoka-tools.txt"
      - "tools/build/**"
      - ".github/workflows/pyinstaller-onedir.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements-kadoka-tools.txt
            tools/build/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-kadoka-tools.txt
          python -m pip install -r tools/build/requirements.txt

      - name: Build and smoke test one-dir distribution
        run: python tools/build/build_one_dir.py --smoke-test

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/KadokaTools/KadokaTools.exe")) {
            throw "dist/KadokaTools/KadokaTools.exe was not created"
          }

      - name: Upload one-dir artifact
        uses: actions/upload-artifact@v4
        with:
          name: KadokaTools-windows-onedir
          path: dist/KadokaTools/
          if-no-files-found: error
