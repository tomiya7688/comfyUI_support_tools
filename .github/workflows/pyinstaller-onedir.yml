name: PyInstaller onedir

on:
  # This is a required check: never leave a docs-only or src-only PR pending.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build security-patched Python 3.11.18 from source
        shell: pwsh
        run: |
          $version = "3.11.18"
          $archive = Join-Path $env:RUNNER_TEMP "Python-$version.tgz"
          $sourceRoot = Join-Path $env:RUNNER_TEMP "Python-$version"
          $archiveUrl = "https://www.python.org/ftp/python/$version/Python-$version.tgz"
          $expectedSha256 = "5f62711b12470fd435f83f1451c1b1ef4a179aebc715c716874b0967567d814e"

          Invoke-WebRequest -Uri $archiveUrl -OutFile $archive
          $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "CPython source archive SHA-256 mismatch: $actualSha256"
          }

          tar -xzf $archive -C $env:RUNNER_TEMP
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vsInstall) {
            throw "Visual Studio C++ build tools were not found."
          }
          $vcvars = Join-Path $vsInstall "VC\Auxiliary\Build\vcvars64.bat"
          $buildCommand = "`"$vcvars`" && cd /d `"$sourceRoot`" && PCbuild\build.bat -p x64 -c Release -e -M -q"
          & cmd.exe /d /c $buildCommand
          if ($LASTEXITCODE -ne 0) {
            throw "CPython $version source build failed with exit code $LASTEXITCODE."
          }

          $tclLibrary = Join-Path $sourceRoot "externals\tcltk-8.6.12.1\amd64\lib"
          $tclDestination = Join-Path $sourceRoot "PCbuild\lib"
          New-Item -ItemType Directory -Force -Path $tclDestination | Out-Null
          Copy-Item -Path (Join-Path $tclLibrary '*') -Destination $tclDestination -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $sourceRoot "LICENSE") -Destination (Join-Path $sourceRoot "LICENSE.txt")
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $sourceRoot "PCbuild\amd64")

      - name: Verify Python release and compromised-key rejection
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:3] == (3, 11, 18), sys.version"
          python -m ensurepip --upgrade
          python -m unittest test.test_ssl.SSLObjectTests.test_distrusted_spki

      - name: Install dependencies
        shell: pwsh
        run: |
          # The SHA-256 is published in the Python.org incident announcement.
          $bootstrapPipVersion = python -c "import pip; print('.'.join(pip.__version__.split('.')[:2]))"
          if ([version]$bootstrapPipVersion -ge [version]"24.2") {
            python -m pip config --site set global.use-deprecated legacy-certs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -m pip install 'pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70'
          python -m pip config --site set global.use-deprecated legacy-certs
          python -m pip install 'certifi>=2026.10.19'
          python -m pip install -r requirements-kadoka-tools.txt
          python -m pip install -r tools/build/requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Verify Python CA bundles
        run: python tools/security/check_python_ca.py

      - name: Run completion gate
        run: python tools/completion/completion_gate.py

      - name: Build and smoke test one-dir distribution
        run: python tools/build/build_one_dir.py --smoke-test

      - name: Verify frozen CA bundle
        run: python tools/security/check_python_ca.py --distribution-root dist/KadokaTools

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/KadokaTools/KadokaTools.exe")) {
            throw "dist/KadokaTools/KadokaTools.exe was not created"
          }

      - name: Sign and verify Windows binaries
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CODESIGN_PFX_BASE64 -or -not $env:WINDOWS_CODESIGN_PFX_PASSWORD) {
            throw "Public artifact signing is disabled until both Windows code-signing secrets are configured."
          }
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signtool = Get-ChildItem -LiteralPath $sdkRoot -Filter signtool.exe -Recurse -File |
            Sort-Object -Property FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK signtool.exe was not found." }
          $pfxPath = Join-Path $env:RUNNER_TEMP "kadoka-codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
            $binaries = Get-ChildItem -LiteralPath "dist/KadokaTools" -Recurse -File |
              Where-Object { $_.Extension -in @(".exe", ".dll", ".pyd", ".msi", ".msix") }
            if (-not ($binaries | Where-Object { $_.Extension -eq ".exe" })) {
              throw "The distribution has no executable to sign."
            }
            foreach ($binary in $binaries) {
              & $signtool.FullName sign /fd SHA256 /f $pfxPath /p $env:WINDOWS_CODESIGN_PFX_PASSWORD /tr https://timestamp.digicert.com /td SHA256 $binary.FullName
              if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $($binary.Name)." }
              & $signtool.FullName verify /pa /all /v $binary.FullName
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $($binary.Name)." }
            }
          }
          finally {
            Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Package final archive and checksum manifest
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
        run: python tools/build/package_artifact.py dist/KadokaTools dist/release

      - name: Verify package checksum and archive
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
        run: python tools/build/package_artifact.py --verify dist/release

      - name: Upload release staging artifact
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: KadokaTools-release-staging
          path: dist/release/
          if-no-files-found: error
          retention-days: 1

  attest-release:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout verifier
        uses: actions/checkout@v4

      - name: Download staged release files
        uses: actions/download-artifact@v4
        with:
          name: KadokaTools-release-staging
          path: release

      - name: Verify final archive and checksum manifest
        run: python tools/build/package_artifact.py --verify release

      - name: Attest final archive and checksum manifest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/KadokaTools-windows-onedir.zip
            release/SHA256SUMS.txt

      - name: Verify provenance attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          gh attestation verify release/KadokaTools-windows-onedir.zip --repo $env:GITHUB_REPOSITORY --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/pyinstaller-onedir.yml"
          if ($LASTEXITCODE -ne 0) { throw "Archive provenance attestation verification failed." }
          gh attestation verify release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/pyinstaller-onedir.yml"
          if ($LASTEXITCODE -ne 0) { throw "Checksum manifest provenance attestation verification failed." }

      - name: Upload verified CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: KadokaTools-windows-onedir-verified
          path: |
            release/KadokaTools-windows-onedir.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload verified GitHub Release assets
        if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Verified GitHub Release could not be created." }
          }
          gh release upload $tag release/KadokaTools-windows-onedir.zip release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Attested release assets could not be uploaded." }
